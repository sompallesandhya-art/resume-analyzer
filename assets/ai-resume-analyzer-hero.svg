<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b1e" />
      <stop offset="55%" stop-color="#151033" />
      <stop offset="100%" stop-color="#1b1340" />
    </linearGradient>

    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c5cfc" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7c5cfc" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <linearGradient id="cardTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c5cfc" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bg)" />

  <!-- Ambient glows -->
  <circle cx="230" cy="120" r="260" fill="url(#glowViolet)" />
  <circle cx="980" cy="400" r="300" fill="url(#glowEmerald)" />

  <!-- Neural network — left cluster -->
  <g stroke="#7c5cfc" stroke-width="1" opacity="0.35">
    <line x1="90" y1="90" x2="180" y2="150" />
    <line x1="180" y1="150" x2="140" y2="230" />
    <line x1="180" y1="150" x2="260" y2="180" />
    <line x1="90" y1="90" x2="60" y2="190" />
    <line x1="60" y1="190" x2="140" y2="230" />
    <line x1="260" y1="180" x2="230" y2="280" />
    <line x1="140" y1="230" x2="230" y2="280" />
  </g>
  <g fill="#a78bfa">
    <circle cx="90" cy="90" r="4" />
    <circle cx="180" cy="150" r="5" />
    <circle cx="60" cy="190" r="3.5" />
    <circle cx="140" cy="230" r="4.5" />
    <circle cx="260" cy="180" r="4" />
    <circle cx="230" cy="280" r="3.5" />
  </g>

  <!-- Neural network — right cluster -->
  <g stroke="#34d399" stroke-width="1" opacity="0.3">
    <line x1="1000" y1="80" x2="1080" y2="130" />
    <line x1="1080" y1="130" x2="1060" y2="210" />
    <line x1="1080" y1="130" x2="1150" y2="160" />
    <line x1="1000" y1="80" x2="960" y2="160" />
    <line x1="960" y1="160" x2="1060" y2="210" />
    <line x1="1150" y1="160" x2="1120" y2="250" />
  </g>
  <g fill="#6ee7b7">
    <circle cx="1000" cy="80" r="4" />
    <circle cx="1080" cy="130" r="5" />
    <circle cx="960" cy="160" r="3.5" />
    <circle cx="1060" cy="210" r="4.5" />
    <circle cx="1150" cy="160" r="4" />
    <circle cx="1120" cy="250" r="3.5" />
  </g>

  <!-- Faint dot grid, data-visualization texture -->
  <g fill="#f5f3ff" opacity="0.06">
    <circle cx="450" cy="60" r="2" /><circle cx="490" cy="60" r="2" /><circle cx="530" cy="60" r="2" />
    <circle cx="450" cy="95" r="2" /><circle cx="490" cy="95" r="2" /><circle cx="530" cy="95" r="2" />
    <circle cx="700" cy="430" r="2" /><circle cx="740" cy="430" r="2" /><circle cx="780" cy="430" r="2" />
    <circle cx="700" cy="465" r="2" /><circle cx="740" cy="465" r="2" /><circle cx="780" cy="465" r="2" />
  </g>

  <!-- Floating resume document card -->
  <g transform="translate(430 60) rotate(-5)" filter="url(#softShadow)">
    <rect x="0" y="0" width="300" height="380" rx="18" fill="#0f0c26" stroke="rgba(255,255,255,0.08)" />
    <rect x="0" y="0" width="300" height="380" rx="18" fill="#16123a" opacity="0.9" />
    <rect x="0" y="0" width="300" height="10" rx="5" fill="url(#cardTop)" />

    <!-- avatar + name block -->
    <circle cx="46" cy="56" r="18" fill="#7c5cfc" opacity="0.85" />
    <rect x="76" y="46" width="120" height="9" rx="4.5" fill="#f5f3ff" opacity="0.9" />
    <rect x="76" y="62" width="80" height="7" rx="3.5" fill="#a5a0c4" opacity="0.7" />

    <!-- section divider -->
    <rect x="30" y="100" width="240" height="1.5" fill="rgba(255,255,255,0.08)" />

    <!-- body lines -->
    <rect x="30" y="122" width="180" height="8" rx="4" fill="#f5f3ff" opacity="0.75" />
    <rect x="30" y="142" width="240" height="6" rx="3" fill="#a5a0c4" opacity="0.55" />
    <rect x="30" y="156" width="220" height="6" rx="3" fill="#a5a0c4" opacity="0.55" />
    <rect x="30" y="170" width="230" height="6" rx="3" fill="#a5a0c4" opacity="0.55" />

    <rect x="30" y="200" width="150" height="8" rx="4" fill="#f5f3ff" opacity="0.75" />
    <rect x="30" y="220" width="240" height="6" rx="3" fill="#a5a0c4" opacity="0.55" />
    <rect x="30" y="234" width="200" height="6" rx="3" fill="#a5a0c4" opacity="0.55" />
    <rect x="30" y="248" width="225" height="6" rx="3" fill="#a5a0c4" opacity="0.55" />

    <!-- skill pills -->
    <rect x="30" y="278" width="60" height="20" rx="10" fill="#34d399" opacity="0.18" stroke="#34d399" stroke-opacity="0.4" />
    <rect x="98" y="278" width="70" height="20" rx="10" fill="#34d399" opacity="0.18" stroke="#34d399" stroke-opacity="0.4" />
    <rect x="176" y="278" width="55" height="20" rx="10" fill="#34d399" opacity="0.18" stroke="#34d399" stroke-opacity="0.4" />
    <rect x="30" y="306" width="80" height="20" rx="10" fill="#fb7185" opacity="0.14" stroke="#fb7185" stroke-opacity="0.35" />
    <rect x="118" y="306" width="65" height="20" rx="10" fill="#fb7185" opacity="0.14" stroke="#fb7185" stroke-opacity="0.35" />

    <rect x="30" y="344" width="240" height="6" rx="3" fill="#a5a0c4" opacity="0.4" />
    <rect x="30" y="358" width="180" height="6" rx="3" fill="#a5a0c4" opacity="0.4" />
  </g>

  <!-- ATS score ring, overlapping the document -->
  <g transform="translate(730 300)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="86" fill="#0f0c26" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="0" cy="0" r="68" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="12" />
    <circle
      cx="0" cy="0" r="68" fill="none"
      stroke="#34d399" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="427.3"
      stroke-dashoffset="70"
      transform="rotate(-90)"
    />
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#f5f3ff">92</text>
    <text x="0" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" letter-spacing="2" fill="#a5a0c4">ATS SCORE</text>
  </g>

  <!-- small floating accent dots for depth -->
  <g fill="#7c5cfc" opacity="0.5">
    <circle cx="380" cy="430" r="3" />
    <circle cx="410" cy="450" r="2" />
  </g>
  <g fill="#34d399" opacity="0.5">
    <circle cx="850" cy="90" r="3" />
    <circle cx="880" cy="70" r="2" />
  </g>
</svg>